main: su.nightexpress.excellentenchants.EnchantsPlugin
bootstrapper: su.nightexpress.excellentenchants.bridge.paper.PaperEnchantsBootstrap
name: ExcellentEnchants
version: '${project.version}'
description: A lot of new enchantments properly integrated into the server!
api-version: '1.21'
#loader: io.papermc.testplugin.TestPluginLoader
dependencies:
  # gamai.ru downstream: nightcore is shaded into this jar, so it is no longer a
  # required external plugin dependency (prod runs standalone nightcore 2.13.2 for CoinsEngine).
  bootstrap:
    ProtocolLib:
      load: BEFORE
      required: false
  server:
    ProtocolLib:
      load: BEFORE
      required: false
    packetevents:
      load: BEFORE
      required: false
    PlaceholderAPI:
      required: false
    MythicMobs:
      required: false